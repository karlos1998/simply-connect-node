name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build && npm run pack:check
      - name: Pack release artifacts
        run: |
          mkdir release
          npm pack --workspace @simply-connect/node --pack-destination release
          npm pack --workspace @simply-connect/nestjs --pack-destination release
      - name: Publish to npm when credentials are configured
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          npm publish --workspace @simply-connect/node
          npm publish --workspace @simply-connect/nestjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --generate-notes --title "Simply Connect Node.js ${GITHUB_REF_NAME#v}"
